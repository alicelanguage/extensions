[package]
name = "alice-editor-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
alice-editor-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
