id = "alice"
name = "Alice"
version = "0.11.2"
schema_version = 1
authors = ["Alice Language"]
description = "Alice language support: highlighting, completion, diagnostics, .NET interop and NuGet assistance."
repository = "https://github.com/alicelanguage/extensions"

[language_servers.alice]
name = "Alice"
languages = ["Alice", "Alice Manifest", "Alice Project"]

[grammars.ruby]
repository = "https://github.com/tree-sitter/tree-sitter-ruby"
rev = "ad907a69da0c8a4f7a943a7fe012712208da6dee"

[grammars.toml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-toml"
rev = "64b56832c2cffe41758f28e05c756a3a98d16f41"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

# Only the version probe uses process::Command; the executable path is user-configurable.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]
