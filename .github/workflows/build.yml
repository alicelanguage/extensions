name: Build editor extensions
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vscode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test -p alice-editor-core --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: npm ci
        working-directory: vscode
      - run: npm run build:native
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package -- --target ${{ matrix.target }} --out alice-language-0.11.1-${{ matrix.target }}.vsix
        working-directory: vscode
      - uses: actions/upload-artifact@v4
        with:
          name: alice-${{ matrix.target }}
          path: vscode/*.vsix
  zed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: cargo build --locked -p alice-zed --release --target wasm32-wasip2
      - run: python scripts/package-zed.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tree-sitter==0.26.0
      - run: python scripts/check-queries.py
      - uses: actions/upload-artifact@v4
        with:
          name: alice-zed
          path: alice-zed-*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vscode, zed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/*.vsix artifacts/*.tar.gz --clobber
